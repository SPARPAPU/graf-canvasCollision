<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.5 Interactividad con Gráficos 2D</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white d-flex flex-column min-vh-100">

    <!-- Encabezado Azul Bootstrap -->
    <header class="bg-primary text-white text-center py-3 shadow">
        <h1 class="h3 m-0 fw-bold">2.5 Interactividad con Gráficos 2D</h1>
    </header>

    <!-- Contenido Principal -->
    <main class="container-fluid my-auto py-3">
        <div class="row justify-content-center g-3">
            
            <!-- Lienzo de Simulación (Canvas) -->
            <div class="col-12 col-xl-9">
                <div class="shadow-lg p-2 text-center position-relative" style="background-color: #1a1a1a; border-radius: 20px;">
                    <!-- Marcador de Objetos Eliminados -->
                    <div id="scoreBox" class="position-absolute top-0 end-0 m-3 px-3 py-2 bg-black rounded-3 shadow-sm border border-2 border-primary fw-bold text-primary fs-5">
                        Eliminadas: <span id="scoreVal" class="text-danger">0</span>
                    </div>
                    <canvas id="canvas"></canvas>
                </div>
            </div>

            <!-- Panel de Estado del Juego (Texto Claro de Alto Contraste) -->
            <div class="col-12 col-xl-3">
                <div class="shadow-lg p-4 h-100 bg-black text-white border border-secondary rounded-4">
                    <h5 class="fw-bold mb-3 text-primary">
                        <i class="fa-solid fa-gamepad me-2"></i>Estado del Juego
                    </h5>
                    <hr class="border-secondary">

                    <p class="small text-light opacity-75">
                        Haz clic sobre Freddy, Bonnie, Foxy o Chica antes de que toquen el suelo de la oficina.
                    </p>

                    <!-- Indicador del Nivel de Velocidad -->
                    <div class="mb-3 p-3 bg-dark rounded border border-secondary">
                        <span class="d-block text-white-50 small fw-bold">Nivel de Velocidad:</span>
                        <span id="speedLevel" class="badge bg-success fs-6 mt-1">Normal (1.0x)</span>
                    </div>

                    <!-- Botón Reiniciar -->
                    <div class="d-grid gap-2 mt-4">
                        <button id="btnReset" class="btn btn-primary fw-bold">
                            <i class="fa-solid fa-rotate-right me-2"></i>Reiniciar
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Pie de Página Oscuro -->
    <footer class="bg-black text-secondary text-center py-3 mt-auto border-top border-secondary">
        <h2 class="h5 m-0 fw-bold">HTML CSS BOOTSTRAP - GRAFICACIÓN</h2>
    </footer>

    <!-- Scripts de Bootstrap y Lógica JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="colision.js"></script>
</body>
</html>
