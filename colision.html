<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.4 Detección de colisiones - Graficación</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Encabezado Azul Bootstrap -->
    <header class="bg-primary text-white text-center py-3 shadow">
        <h1 class="h3 m-0 fw-bold">2.4 Detección de Colisiones en Canvas 2D</h1>
    </header>

    <!-- Contenido Principal -->
    <main class="container-fluid my-auto py-4">
        <div class="row justify-content-center g-4">
            
            <!-- Lienzo de Simulación (Canvas) -->
            <div class="col-12 col-xl-9">
                <div class="shadow-lg p-3 text-center" style="background-color: #e3e3e3; border-radius: 20px;">
                    <canvas id="canvas"></canvas>
                </div>
            </div>

            <!-- Panel de Controles y Métricas -->
            <div class="col-12 col-xl-3">
                <div class="shadow-lg p-4 h-100" style="background-color: #f3f3f3; border-radius: 20px;">
                    <h5 class="fw-bold mb-3 text-primary">
                        <i class="fa-solid fa-sliders me-2"></i>Panel de Control
                    </h5>
                    <hr>

                    <!-- Barra de Velocidad -->
                    <div class="mb-3">
                        <label for="speedRange" class="form-label fw-semibold small">
                            Velocidad: <span id="speedVal" class="badge bg-primary">1.0x</span>
                        </label>
                        <input type="range" class="form-range" id="speedRange" min="0.2" max="3.0" step="0.1" value="1.0">
                    </div>

                    <!-- Control de Duración del Flasheo Azul -->
                    <div class="mb-3">
                        <label for="flashDuration" class="form-label fw-semibold small">
                            Duración Flasheo Azul (Frames): <span id="flashVal" class="badge bg-primary">15</span>
                        </label>
                        <input type="range" class="form-range" id="flashDuration" min="1" max="60" value="15">
                    </div>

                    <!-- Control de Círculos -->
                    <div class="mb-3">
                        <label for="circleCount" class="form-label fw-semibold small">
                            Cantidad de Círculos: <span id="circleVal" class="badge bg-primary">20</span>
                        </label>
                        <input type="range" class="form-range" id="circleCount" min="2" max="50" value="20">
                    </div>

                    <!-- Botones de Acción -->
                    <div class="d-grid gap-2 mt-4">
                        <button id="btnPause" class="btn btn-warning fw-bold">
                            <i class="fa-solid fa-pause me-2"></i>Pausar
                        </button>
                        <button id="btnReset" class="btn btn-primary fw-bold">
                            <i class="fa-solid fa-rotate-right me-2"></i>Regenerar
                        </button>
                    </div>

                    <!-- Métricas -->
                    <div class="mt-4 p-3 bg-white rounded-3 shadow-sm">
                        <h6 class="fw-bold text-secondary mb-2 small"><i class="fa-solid fa-chart-line me-2"></i>Métricas</h6>
                        <div class="d-flex justify-content-between small">
                            <span>Colisiones detectadas:</span>
                            <span id="collisionCount" class="fw-bold text-danger">0</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Pie de Página Oscuro -->
    <footer class="bg-secondary text-white text-center py-3 mt-auto">
        <h2 class="h5 m-0 fw-bold">HTML CSS BOOTSTRAP - GRAFICACIÓN</h2>
    </footer>

    <!-- Bootstrap JS y Lógica de Colisiones -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="colision.js"></script>
</body>
</html>
